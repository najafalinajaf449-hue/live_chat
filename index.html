<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Lounge Chat</title>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      --card-bg: rgba(15, 23, 42, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
    }

    body.theme-sunset {
      --bg-grad: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
    }
    body.theme-emerald {
      --bg-grad: linear-gradient(135deg, #064e3b 0%, #0f766e 50%, #115e59 100%);
    }
    body.theme-aurora {
      --bg-grad: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.4s ease;
    }

    .app {
      width: 100%;
      max-width: 920px;
      height: 88vh;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: grid;
      grid-template-columns: 1fr 240px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; height: 94vh; }
      .sidebar { display: none; }
    }

    .chat-panel { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    .topbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .theme-box { display: flex; gap: 6px; align-items: center; }

    input, select, button {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 8px 11px;
      font-size: 14px;
      outline: none;
    }

    input:disabled, button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    select option { background: #1e293b; color: #f8fafc; }

    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button.danger { background: var(--danger); padding: 4px 8px; font-size: 12px; }
    button.success { background: var(--success); }
    button.ghost { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); }

    .closed-banner {
      display: none;
      padding: 10px 16px;
      background: rgba(239, 68, 68, 0.2);
      border-bottom: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .closed-banner.active {
      display: block;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 13px;
      max-width: 82%;
      align-self: flex-start;
    }

    .msg.mine {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }

    .msg-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .msg-meta strong { color: #e2e8f0; }
    .msg-text { font-size: 15px; line-height: 1.45; word-break: break-word; }

    .typing {
      padding: 0 16px 6px;
      font-size: 12px;
      color: var(--muted);
      min-height: 20px;
    }

    .emoji-bar {
      padding: 6px 14px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }

    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      padding: 4px 6px;
      border-radius: 8px;
    }

    .emoji-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

    .composer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .composer input { flex: 1; }

    .sidebar {
      border-left: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.18);
    }

    .sidebar h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 6px;
      font-size: 13px;
    }

    .admin-box { display: flex; flex-direction: column; gap: 8px; }
    .admin-controls { display: none; flex-direction: column; gap: 8px; }
    .admin-controls.active { display: flex; }
  </style>
</head>
<body>
  <div class="app">
    <div class="chat-panel">
      <div class="topbar">
        <div class="theme-box">
          <select id="themeSelect" title="Background Theme">
            <option value="">Indigo Night</option>
            <option value="theme-sunset">Twilight Purple</option>
            <option value="theme-emerald">Emerald Mist</option>
            <option value="theme-aurora">Deep Aurora</option>
          </select>
        </div>
      </div>

      <div id="closedBanner" class="closed-banner">
        Chat is currently closed by the admin.
      </div>

      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>

      <div class="emoji-bar" id="emojiBar"></div>

      <form id="chatForm" class="composer">
        <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </div>

    <aside class="sidebar">
      <div>
        <h3>Online (<span id="onlineCount">0</span>)</h3>
        <div id="userList"></div>
      </div>

      <div class="admin-box">
        <h3>Admin Controls</h3>
        <div id="adminLoginRow" style="display:flex; gap:6px;">
          <input id="adminKeyInput" type="password" placeholder="Admin key" style="width:100%;" />
          <button id="adminLoginBtn" class="ghost">Unlock</button>
        </div>

        <div id="adminControls" class="admin-controls">
          <button id="toggleChatBtn" class="danger" style="padding:8px;">Close Chat</button>
          <button id="clearHistoryBtn" class="danger" style="padding:8px;">Refresh / Clear Chat</button>
          <span style="font-size:12px; color:var(--muted);">Click "Delete" on any message or "Block" next to a user.</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({
      transports: ["websocket"],
    });
    let isAdmin = false;
    let isChatClosed = false;
    let currentUsers = [];

    const emojis = ["😀","😂","😍","🔥","👍","🎉","🤔","😭","🚀","❤️","✨","🙌"];
    const emojiBar = document.getElementById("emojiBar");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const closedBanner = document.getElementById("closedBanner");
    const toggleChatBtn = document.getElementById("toggleChatBtn");
    const messagesEl = document.getElementById("messages");
    const typingEl = document.getElementById("typing");

    emojis.forEach((em) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "emoji-btn";
      btn.textContent = em;
      btn.onclick = () => {
        if (msgInput.disabled) return;
        msgInput.value += em;
        msgInput.focus();
      };
      emojiBar.appendChild(btn);
    });

    function applyRoomState() {
      const lockedForUser = isChatClosed && !isAdmin;
      closedBanner.classList.toggle("active", isChatClosed);
      msgInput.disabled = lockedForUser;
      sendBtn.disabled = lockedForUser;
      msgInput.placeholder = lockedForUser
        ? "Chat is closed by admin..."
        : "Type a message...";

      document.querySelectorAll(".emoji-btn").forEach((b) => {
        b.disabled = lockedForUser;
      });

      if (isChatClosed) {
        toggleChatBtn.textContent = "Reopen Chat";
        toggleChatBtn.classList.remove("danger");
        toggleChatBtn.classList.add("success");
      } else {
        toggleChatBtn.textContent = "Close Chat";
        toggleChatBtn.classList.remove("success");
        toggleChatBtn.classList.add("danger");
      }
    }

    const themeSelect = document.getElementById("themeSelect");
    const savedTheme = localStorage.getItem("chatTheme") || "";
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      themeSelect.value = savedTheme;
    }
    themeSelect.onchange = () => {
      document.body.classList.remove("theme-sunset", "theme-emerald", "theme-aurora");
      if (themeSelect.value) document.body.classList.add(themeSelect.value);
      localStorage.setItem("chatTheme", themeSelect.value);
    };

    document.getElementById("chatForm").onsubmit = (e) => {
      e.preventDefault();
      if (isChatClosed && !isAdmin) return;
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit("chat:message", text);
      msgInput.value = "";
      socket.emit("chat:typing", false);
    };

    let typingTimeout;
    msgInput.addEventListener("input", () => {
      if (isChatClosed && !isAdmin) return;
      socket.emit("chat:typing", true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit("chat:typing", false), 1200);
    });

    function renderMessage(m) {
      const div = document.createElement("div");
      div.className = "msg" + (m.socketId === socket.id ? " mine" : "");
      div.dataset.id = m.id;

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      meta.innerHTML = `<strong>${escapeHtml(m.sender)}</strong><span>${escapeHtml(m.time)}</span>`;

      if (isAdmin) {
        const delBtn = document.createElement("button");
        delBtn.className = "danger";
        delBtn.textContent = "Delete";
        delBtn.onclick = () => socket.emit("admin:deleteMessage", m.id);
        meta.appendChild(delBtn);
      }

      const body = document.createElement("div");
      body.className = "msg-text";
      body.textContent = m.text;

      div.append(meta, body);
      messagesEl.appendChild(div);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    socket.on("chat:roomState", ({ closed }) => {
      isChatClosed = Boolean(closed);
      applyRoomState();
    });

    socket.on("chat:error", (msg) => {
      alert(msg);
    });

    socket.on("chat:history", (list) => {
      messagesEl.innerHTML = "";
      list.forEach(renderMessage);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    socket.on("chat:message", (m) => {
      renderMessage(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    socket.on("chat:deleteMessage", (msgId) => {
      const el = messagesEl.querySelector(`.msg[data-id="${msgId}"]`);
      if (el) el.remove();
    });

    const activeTypers = new Set();
    socket.on("chat:typing", ({ name, isTyping }) => {
      if (isTyping) activeTypers.add(name);
      else activeTypers.delete(name);
      typingEl.textContent = activeTypers.size
        ? `${[...activeTypers].join(", ")} typing...`
        : "";
    });

    function renderUsers(users) {
      currentUsers = users;
      document.getElementById("onlineCount").textContent = users.length;
      const listEl = document.getElementById("userList");
      listEl.innerHTML = "";
      users.forEach((u) => {
        const row = document.createElement("div");
        row.className = "user-item";
        row.innerHTML = `<span>${escapeHtml(u.name)}</span>`;
        if (isAdmin && u.socketId !== socket.id) {
          const blockBtn = document.createElement("button");
          blockBtn.className = "danger";
          blockBtn.textContent = "Block";
          blockBtn.onclick = () => socket.emit("admin:blockUser", u.socketId);
          row.appendChild(blockBtn);
        }
        listEl.appendChild(row);
      });
    }

    socket.on("users:list", renderUsers);

    document.getElementById("adminLoginBtn").onclick = () => {
      socket.emit("admin:login", document.getElementById("adminKeyInput").value);
    };

    socket.on("admin:auth", ({ ok, error }) => {
      if (!ok) return alert(error || "Auth failed");
      isAdmin = true;
      document.getElementById("adminLoginRow").style.display = "none";
      document.getElementById("adminControls").classList.add("active");
      applyRoomState();
      renderUsers(currentUsers);
    });

    toggleChatBtn.onclick = () => {
      socket.emit("admin:setChatClosed", !isChatClosed);
    };

    document.getElementById("clearHistoryBtn").onclick = () => {
      if (confirm("Clear chat history for everyone?")) {
        socket.emit("admin:clearHistory");
      }
    };

    socket.on("system:blocked", (reason) => {
      alert(reason);
      document.body.innerHTML = `<div style="color:white;text-align:center;margin-top:20vh;"><h2>${escapeHtml(reason)}</h2></div>`;
    });
  </script>
</body>
</html>
